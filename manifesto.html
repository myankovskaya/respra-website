<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manifesto — Respra</title>
  <link rel="stylesheet" href="shared.css" />
  <style>

    body { background: #fff; }

    /* ─── FULL-BLEED VIDEO HERO ─── */
    .manifesto-hero {
      width: 100%;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 120px 44px 80px;
      gap: 56px;
      position: relative;
      overflow: hidden;
      background: #fff;
    }

    /* Subtle teal glow behind video */
    .manifesto-hero::before {
      content: '';
      position: absolute;
      width: 900px;
      height: 900px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(12,98,114,0.06) 0%, transparent 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }

    .manifesto-label {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .manifesto-label .eyebrow {
      margin-bottom: 12px;
      opacity: 1;
    }

    .manifesto-label h1 {
      font-size: clamp(42px, 6vw, 80px);
      letter-spacing: -2.5px;
      line-height: 1.0;
      color: var(--teal);
    }

    .manifesto-label h1 em {
      font-style: italic;
      font-weight: 400;
      opacity: 0.35;
    }

    /* ─── VIDEO WRAPPER ─── */
    .video-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 1000px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow:
        0 4px 24px rgba(12,98,114,0.08),
        0 24px 80px rgba(12,98,114,0.12),
        0 0 0 1px rgba(12,98,114,0.1);
      background: #000;
      aspect-ratio: 16 / 9;
    }

    .video-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Placeholder shown when no URL set */
    .video-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: linear-gradient(135deg, #052f38 0%, #0c6272 100%);
      aspect-ratio: 16 / 9;
    }

    .play-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: rgba(238,248,250,0.12);
      border: 1.5px solid rgba(238,248,250,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .play-btn:hover {
      background: rgba(238,248,250,0.2);
      transform: scale(1.06);
    }

    .play-btn svg {
      width: 28px;
      height: 28px;
      fill: rgba(238,248,250,0.8);
      margin-left: 4px;
    }

    .video-placeholder-text {
      font-family: var(--body);
      font-size: 13px;
      font-weight: 400;
      color: rgba(238,248,250,0.35);
      letter-spacing: 0.5px;
    }

    /* ─── CAPTION ─── */
    .manifesto-caption {
      position: relative;
      z-index: 1;
      text-align: center;
      max-width: 520px;
    }

    .manifesto-caption p {
      font-size: 16px;
      font-weight: 300;
      color: var(--ink-low);
      line-height: 1.7;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>
<body>

<!-- NAV -->
<nav id="main-nav">
  <a href="index.html" class="nav-logo">
    <span class="nav-wordmark">respra</span>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="about.html">About</a></li>
    <li><a href="technology.html">Technology</a></li>
    <li><a href="implementation.html">Implementation</a></li>
    <li><a href="manifesto.html" class="active">Manifesto</a></li>
  </ul>
  <div class="nav-right">
    <a href="about.html" class="nav-cta">Learn more</a>
    <div class="nav-contact-wrap">
      <button class="nav-contact-btn" id="contact-btn">Contact Us</button>
      <div class="nav-contact-popup" id="contact-popup">
        <a href="mailto:contact@respra.ca">contact@respra.ca</a>
      </div>
    </div>
  </div>
</nav>

<div class="page-wrap">

  <section class="manifesto-hero" data-screen-label="01 Manifesto">

    <div class="manifesto-label" style="opacity:0; animation: fadeUp 1s cubic-bezier(.16,1,.3,1) 0.1s forwards;">
      <span class="eyebrow">Manifesto</span>
      <h1>Why we <em>breathe.</em></h1>
    </div>

    <!-- Video -->
    <div class="video-wrap" style="opacity:0; animation: fadeUp 1s cubic-bezier(.16,1,.3,1) 0.28s forwards;">
      <iframe
        width="100%"
        height="100%"
        src="https://www.youtube.com/embed/5BINtppEgbo"
        title="Respra Manifesto"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <div class="manifesto-caption" style="opacity:0; animation: fadeUp 1s cubic-bezier(.16,1,.3,1) 0.44s forwards;">
      <p>Early detection changes everything. This is why we built Respra.</p>
    </div>

  </section>

  <!-- FOOTER -->
  <footer>
    <div>
      <div class="foot-brand">respra</div>
      <div style="margin-top:6px;">© 2025 Respra, Inc. — <em>know in a breath.</em></div>
    </div>
    <div class="foot-links">
      <a href="about.html">About</a>
      <a href="technology.html">Technology</a>
      <a href="implementation.html">Implementation</a>
      <a href="manifesto.html" class="active">Manifesto</a>
    </div>
  </footer>

</div>


<script>
  const nav = document.getElementById('main-nav');
  window.addEventListener('scroll', () => {
    nav.style.background = window.scrollY > 40 ? 'rgba(255,255,255,0.97)' : 'rgba(255,255,255,0.86)';
  }, { passive: true });

  const contactBtn = document.getElementById('contact-btn');
  const contactPopup = document.getElementById('contact-popup');
  if (contactBtn && contactPopup) {
    contactBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      contactPopup.classList.toggle('open');
    });
    document.addEventListener('click', function() {
      contactPopup.classList.remove('open');
    });
  }
</script>

</body>
</html>
